<header class="page-intro content-section"><h1>Publications.</h1><p class="lede">The evidence and methods behind our research.</p><p>Browse by research theme, follow a paper to its journal, or explore the open software and field resources connected to the work.</p></header>

    <section class="content-section publication-surface">
      <div class="publication-controls">
        <div class="filter-bar" aria-label="Publication filters">
          <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-chip" type="button" data-filter="sea-level" aria-pressed="false">Sea level</button>
          <button class="filter-chip" type="button" data-filter="carbon-cycle" aria-pressed="false">Carbon cycle</button>
          <button class="filter-chip" type="button" data-filter="stratigraphy" aria-pressed="false">Stratigraphy</button>
          <button class="filter-chip" type="button" data-filter="methods" aria-pressed="false">Methods</button>
          <button class="filter-chip" type="button" data-filter="ice-sheets" aria-pressed="false">Ice sheets</button>
        </div>
        <p class="filter-count" data-filter-count aria-live="polite"></p>
      </div>

      <p class="empty-state" data-publication-empty hidden>
        No publications match that theme yet. Try another research thread.
      </p>
      <div
        class="publication-overview"
        id="publication-overview"
        aria-label="Publication overview timeline"
        data-publication-overview
      ></div>
      <div class="publication-timeline" id="publication-grid">{{publication_grid}}</div>
    </section>
