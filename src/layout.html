<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} | Earth History @ UVic</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f6f3ed">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} | Earth History @ UVic">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://blakedyer.github.io/assets/images/cook-islands/hs107-coastal-setting.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="revision.css">
  {{scripts}}
  <script defer src="theme.js"></script>
  <script defer src="revision.js"></script>
</head>
<body data-page="{{page}}" class="revision-page">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {{header}}
  <main id="main-content" class="site-main">
    {{body}}
  </main>
  {{footer}}
</body>
</html>
